name: Tally checks

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "schedule = external pinger, manual = human run"
        type: choice
        options:
          - schedule
          - manual
        required: false
        default: schedule
      simulate_failure:
        description: "Stage a demo failure for the next 4 runs (manual only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: tally-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker dependency
        run: python -m pip install --quiet requests

      - name: Probe public endpoints
        working-directory: app
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER: ${{ inputs.trigger }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TRIGGER" = "schedule" ]; then
            FLAGS="--data-dir ../data --event schedule"
          else
            FLAGS="--data-dir ../data --event workflow_dispatch --simulate ${SIMULATE_FAILURE:-false}"
          fi
          python worker/run_checks.py $FLAGS

      - name: Commit run records to data branch
        working-directory: data
        run: |
          git config user.name "tally-bot"
          git config user.email "tally-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Record checks $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:data
          fi
